    const warm=ctx.createRadialGradient(313,83,1,313,83,155);
    warm.addColorStop(0,'#ffd19245');warm.addColorStop(1,'#ffddaa00');
    ctx.fillStyle=warm;ctx.fillRect(160,15,220,200);
    const blue=ctx.createRadialGradient(237,91,1,237,91,105);
    blue.addColorStop(0,'#a7d9eb30');blue.addColorStop(1,'#a7d9eb00');
    ctx.fillStyle=blue;ctx.fillRect(160,30,190,170);
    this.seatedKauane();
    ctx.drawImage(this.texture,190,65,94,52);
  },
  render() {
    this.virtualWorld();
    const phase=this.phase;
    if(['quiet','treeDialogue'].includes(phase)) {
      ctx.drawImage(this.texture,0,0);
      return;
    }
    if(phase==='pullback') {
      this.room();
      const progress=Math.min(1,this.time/14),t=progress*progress*(3-2*progress);
      const a=190*t,b=65*t,w=400+(94-400)*t,h=230+(52-230)*t;
      rect(a-5*t,b-5*t,w+10*t,h+10*t,'#3b3743');
      ctx.drawImage(this.texture,a,b,w,h);
      return;
    }
    ctx.save();
    let zoom=1,focusX=200,focusY=115;
    if(phase==='reaction'||phase==='whisper'){zoom=1.25;focusX=280;focusY=135;}
    if(phase==='memory'){zoom=2.8;focusX=342;focusY=113;}
    if(phase==='montage'){
      const shot=Math.min(4,Math.floor(this.time/5));
      const views=[[1,200,115],[1.6,239,91],[2.1,237,91],[2.8,342,113],[1.5,290,144]];
      [zoom,focusX,focusY]=views[shot];zoom+=Math.sin((this.time%5)/5*Math.PI)*.07;
    }
    ctx.translate(200,115);ctx.scale(zoom,zoom);ctx.translate(-focusX,-focusY);
    this.room();
    ctx.restore();
    if(phase==='memory'){
      this.caption(this.flowerMemory?'Pra lembrar de hoje.':'Um dia.',212);
    }
    if(phase==='montage'){
      // A short dark veil softens each five-second camera change.
      const fade=Math.max(0,1-(this.time%5)/.6);
      ctx.fillStyle='rgba(18,16,26,'+(fade*.7)+')';ctx.fillRect(0,0,400,230);
    }
    if(phase==='caption'){
      const first=this.time<7.5;
      this.caption(first?'Existem distâncias que podem ser':'Mas existem proximidades que nenhuma',102);
      this.caption(first?'medidas em quilômetros...':'distância consegue explicar.',120);
    }
    if(phase==='fade'){
      const dark=Math.min(1,this.time/11);
      ctx.fillStyle='rgba(8,9,17,'+dark+')';ctx.fillRect(0,0,400,230);
      if(this.time<9){ctx.globalAlpha=1-this.time/9;ctx.drawImage(this.texture,190,65,94,52);ctx.globalAlpha=1;}
    }
    if(phase==='end'){
      rect(0,0,400,230,'#0c0d16');
      this.caption(this.future?'Nossa história continuará...':'E, sem perceber, dois mundos',87);
      this.caption(this.future?'Novos capítulos chegam em breve.':'começaram a se tornar um só.',105);
      if(this.time>4||this.future)this.caption('FIM DO CAPÍTULO I',151);
      if(this.time>6||this.future)this.caption('ENTRE DOIS MUNDOS',172);
    }
  },
  caption(text,b) {
    ctx.fillStyle='#eee0d2';ctx.font='10px monospace';ctx.textAlign='center';
    ctx.fillText(text,200,b);ctx.textAlign='start';
  }
};
