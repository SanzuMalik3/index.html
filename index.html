<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Celebração de 2 meses</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#12061f;font-family:Georgia,'Times New Roman',serif}
  body{background:radial-gradient(ellipse at 50% 30%,#3a1247 0%,#1c0b2e 55%,#0b0414 100%)}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  .center{position:fixed;left:0;right:0;display:flex;justify-content:center;pointer-events:none}
  #start{inset:0;top:0;bottom:0;align-items:center;background:rgba(11,4,20,.88);pointer-events:auto;cursor:pointer;
    color:#ffd1e3;font-size:clamp(18px,4vw,26px);letter-spacing:.06em;transition:opacity 1s;z-index:5;text-align:center;padding:20px}
  #start span{animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.45}}
  #go{bottom:calc(30% + 40px);top:auto;opacity:0;transition:opacity 1.6s;z-index:4}
  #go.show{opacity:1}
  #go button{pointer-events:none;font:italic 700 clamp(18px,4.5vw,24px) Georgia,serif;color:#fff;padding:14px 42px;border-radius:999px;
    border:1.5px solid rgba(255,182,213,.8);background:rgba(255,120,170,.18);backdrop-filter:blur(6px);cursor:pointer;
    box-shadow:0 0 24px rgba(255,120,170,.45);transition:transform .2s,background .2s;letter-spacing:.05em}
  #go.show button{pointer-events:auto}
  #go button:hover{transform:scale(1.07);background:rgba(255,120,170,.35)}
  #s1{transition:opacity 1.5s}
  #s1.out{opacity:0;pointer-events:none}
  #s2{position:fixed;inset:0;z-index:7;opacity:0;pointer-events:none;transition:opacity 1.6s;overflow:hidden;
    background:linear-gradient(#6ec3ff 0%,#bfe6ff 38%,#fff1c2 56%);--w:clamp(70px,15vw,120px)}
  #s2.show{opacity:1;pointer-events:auto}
  #sun{position:absolute;top:5%;right:8%;width:clamp(60px,12vw,110px);aspect-ratio:1;border-radius:50%;
    background:radial-gradient(#fffbe0,#ffe066 60%,#ffc933);box-shadow:0 0 60px 30px rgba(255,220,90,.55)}
  #ground{position:absolute;left:-10%;right:-10%;bottom:0;height:48%;border-radius:50% 50% 0 0/22% 22% 0 0;
    background:linear-gradient(#7cc25a,#4d9a3c 60%,#3c7f2f)}
  #ttl{position:absolute;top:6%;left:0;right:0;text-align:center;font:italic 700 clamp(26px,6vw,46px) Georgia,serif;
    color:#5a3416;text-shadow:0 2px 0 #fff8d6;transition:opacity 1s;padding:0 16px}
  #cnt{position:absolute;top:calc(6% + clamp(50px,9vw,72px));left:50%;transform:translateX(-50%);padding:6px 18px;border-radius:999px;
    background:rgba(255,255,255,.7);color:#5a3416;font:700 clamp(16px,3.5vw,20px) Georgia,serif;transition:opacity 1s}
  .fl{position:absolute;aspect-ratio:100/160;cursor:pointer;transition:transform 1s cubic-bezier(.5,0,.3,1),opacity .4s .7s}
  .fl:hover:not(.got){filter:brightness(1.12) drop-shadow(0 0 10px #fff3a0)}
  .sw{width:100%;height:100%;display:block;overflow:visible;transform-origin:50% 100%;animation:sway 3.5s ease-in-out infinite alternate}
  @keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
  #bq{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;pointer-events:none}
  #bq svg{width:min(62vw,300px,42vh);transform:scale(.2);opacity:0;transition:transform 2s cubic-bezier(.2,1.3,.4,1),opacity 1.2s}
  #bq p{margin:0;max-width:min(88vw,560px);padding:16px 22px;border-radius:18px;background:rgba(255,249,222,.86);color:#5a3416;
    font:italic clamp(17px,4.2vw,24px)/1.5 Georgia,serif;text-align:center;opacity:0;transition:opacity 2.5s 2s;box-shadow:0 6px 24px rgba(90,52,22,.2)}
  #bq.show svg{transform:scale(1);opacity:1}
  #bq.show p{opacity:1}
  #s2.done #ttl,#s2.done #cnt{opacity:0}
  #bq button{pointer-events:none;opacity:0;transition:opacity 1.5s 5s,transform .2s;font:italic 700 clamp(17px,4vw,22px) Georgia,serif;
    color:#5a3416;padding:12px 38px;border-radius:999px;border:1.5px solid #e0a000;background:rgba(255,214,60,.75);cursor:pointer;
    box-shadow:0 4px 18px rgba(224,160,0,.45);letter-spacing:.04em}
  #bq.show button{opacity:1;pointer-events:auto}
  #bq.show button:hover{transform:scale(1.07)}
  #s3{position:fixed;inset:0;z-index:9;opacity:0;pointer-events:none;transition:opacity 2.2s;
    background:radial-gradient(ellipse at 50% 110%,#1b1a4a 0%,#0b0a24 55%,#03030f 100%)}
  #s3.show{opacity:1}
  #c3{position:absolute;inset:0;width:100%;height:100%}
  #msg3{position:absolute;inset:0;display:flex;flex-direction:column;gap:26px;align-items:center;justify-content:center;padding:20px;pointer-events:none}
  #msg3 p{margin:0;max-width:min(90vw,600px);padding:22px 26px;border-radius:20px;background:rgba(8,8,32,.62);backdrop-filter:blur(6px);
    color:#fff0a8;font:italic clamp(17px,4.2vw,25px)/1.65 Georgia,serif;text-align:center;opacity:0;transition:opacity 3.5s;
    box-shadow:0 0 40px rgba(255,214,60,.25);text-shadow:0 0 14px rgba(255,214,60,.5)}
  #msg3.show p{opacity:1}
  #msg3 button{opacity:0;pointer-events:none;transition:opacity 1.6s 4.5s,transform .2s;font:italic 700 clamp(17px,4vw,22px) Georgia,serif;color:#fff0a8;
    padding:12px 40px;border-radius:999px;border:1.5px solid rgba(255,224,110,.8);background:rgba(255,214,60,.15);cursor:pointer;
    box-shadow:0 0 22px rgba(255,214,60,.4);letter-spacing:.05em}
  #msg3.show button{opacity:1;pointer-events:auto}
  #msg3.show button:hover{transform:scale(1.07);background:rgba(255,214,60,.3)}
  #s4{position:fixed;inset:0;z-index:10;opacity:0;pointer-events:none;transition:opacity 2s;overflow:hidden;
    background:linear-gradient(#2a211f 0%,#3a2e2a 70%,#2a211f 100%)}
  #s4.show{opacity:1;pointer-events:auto}
  #floor{position:absolute;left:0;right:0;bottom:0;height:14%;background:linear-gradient(#1a1311,#0d0807);border-top:3px solid #120c0a}
  #wall{position:absolute;inset:0;display:flex;align-items:center;gap:clamp(50px,9vw,110px);padding:0 14vw 6vh 12vw;
    overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;scrollbar-width:none}
  #wall::-webkit-scrollbar{display:none}
  #wall::after{content:"";flex:0 0 2vw}
  #wtxt{flex:0 0 auto;color:#d9c9a8;font:italic clamp(22px,4.5vw,38px) Georgia,serif;letter-spacing:.12em;writing-mode:horizontal-tb;
    border-left:2px solid #b89a5a;padding-left:18px;scroll-snap-align:start}
  .art{flex:0 0 auto;position:relative;scroll-snap-align:center;cursor:zoom-in;opacity:0;transform:translateY(24px);
    transition:opacity 1.4s,transform 1.4s,filter .3s}
  #s4.show .art{opacity:1;transform:none}
  .art:nth-of-type(2){transition-delay:.5s}.art:nth-of-type(3){transition-delay:.9s}.art:nth-of-type(4){transition-delay:1.3s}.art:nth-of-type(5){transition-delay:1.7s}
  .art::before{content:"";position:absolute;left:-40%;right:-40%;top:-30vh;height:30vh;pointer-events:none;
    background:radial-gradient(ellipse at 50% 100%,rgba(255,236,170,.28),transparent 70%)}
  .fr{padding:clamp(8px,1.6vw,14px);background:linear-gradient(135deg,#e8c875,#9a742a 45%,#f0d98c 70%,#8a6620);
    box-shadow:0 18px 40px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.4) inset}
  .mat{padding:clamp(8px,1.8vw,16px);background:#f4efe6;box-shadow:inset 0 0 8px rgba(0,0,0,.25)}
  .mat img{display:block;height:min(50vh,430px);width:auto;max-width:78vw;object-fit:cover}
  .art:hover{filter:brightness(1.08)}
  .pl{margin:16px auto 0;width:max-content;padding:4px 14px;background:#d9c9a8;color:#3a2e2a;font:italic 13px Georgia,serif;letter-spacing:.15em;border-radius:2px}
  #hint{position:absolute;bottom:4%;left:0;right:0;text-align:center;color:#a8946a;font:italic 14px Georgia,serif;letter-spacing:.1em;animation:pulse 2.5s infinite}
  #lb{position:fixed;inset:0;z-index:11;background:rgba(5,3,3,.92);display:none;align-items:center;justify-content:center;cursor:zoom-out}
  #lb.on{display:flex}
  #lb img{max-width:92vw;max-height:90vh;border:10px solid #f4efe6;box-shadow:0 0 60px rgba(0,0,0,.8)}
  #s4 #wall{justify-content:center;gap:0;padding:0;overflow:hidden}
  #s4 #wtxt{position:absolute;top:5%;left:0;right:0;text-align:center;border:0;padding:0}
  #s4 .art{position:absolute;left:50%;top:47%;margin:0;transition:opacity .9s,transform .9s,filter .3s;transition-delay:0s}
  #s4.show .art{opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.95)}
  #s4.show .art.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
  #s4 .mat img{max-width:68vw;max-height:56vh}
  .ar{position:absolute;top:47%;transform:translateY(-50%);z-index:5;width:clamp(44px,8vw,58px);height:clamp(44px,8vw,58px);border-radius:50%;
    border:1.5px solid #e8c875;background:rgba(232,200,117,.12);color:#e8c875;font:34px/1 Georgia,serif;padding:0 0 4px;cursor:pointer;
    transition:opacity .5s,background .2s,box-shadow .2s;box-shadow:0 0 14px rgba(232,200,117,.25)}
  .ar:hover{background:rgba(232,200,117,.3);box-shadow:0 0 22px rgba(232,200,117,.5)}
  #prv{left:2.5vw;opacity:0;pointer-events:none}#nxt{right:2.5vw}
</style>
</head>
<body>
<div id="s1"><canvas id="c"></canvas>
<div class="center" id="start"><span>♪ toque para começar ♪</span></div>
<div class="center" id="go"><button id="btn">iniciar?</button></div></div>
<div id="s2"><svg width="0" height="0" style="position:absolute"><defs id="df"></defs></svg>
  <div id="sun"></div><div id="ground"></div>
  <div id="ttl">colete cada uma</div><div id="cnt">🌻 0 / 7</div><div id="bq"></div></div>
<div id="s3"><canvas id="c3"></canvas><div id="msg3"><p>meu desejo é que esses 2 meses virem 4 e depois 8 e depois 16 e que quando eu me note estejamos juntos a um tempo que nem me recordo mais, espero que hoje eu consiga te fazer feliz</p><button id="nx3">próximo</button></div></div>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,dpr,pw,kw,ph,x0,pTop;
const WH=[0,2,4,5,7,9,11], BL=[0,1,3,4,5];
const midi=i=>60+12*Math.floor(i/7)+WH[i%7];
const freq=m=>440*Math.pow(2,(m-69)/12);
const press=new Array(14).fill(0);
let glyphs=[],dots=[],textPts=[],gs=12,doneAt=null;

function layout(){
  dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  pw=Math.min(W*.94,900);kw=pw/14;ph=Math.min(H*.28,170);x0=(W-pw)/2;pTop=H-ph-20;
  sampleText();
  dots.forEach((d,i)=>{const t=textPts[i%textPts.length];d.tx=t[0];d.ty=t[1];});
}
function sampleText(){
  const o=document.createElement('canvas');o.width=W;o.height=H;const c=o.getContext('2d');
  const fs=Math.min(W*.13,110),cy=pTop*.42;
  c.fillStyle='#fff';c.textAlign='center';c.textBaseline='middle';
  c.font='italic 700 '+fs+'px Georgia,serif';
  c.fillText('celebração',W/2,cy-fs*.55);c.fillText('de 2 meses',W/2,cy+fs*.65);
  const step=Math.max(5,Math.round(fs/15)),d=c.getImageData(0,0,W,H).data;textPts=[];gs=step*2.4;
  for(let y=0;y<H;y+=step)for(let x=0;x<W;x+=step)if(d[(y*W+x)*4+3]>128)textPts.push([x,y]);
  textPts.sort(()=>Math.random()-.5);
}

/* ---- áudio ---- */
let ac,master;
function tone(f,t,dur,vol){
  [[1,vol],[2,vol*.25],[3,vol*.08]].forEach(([m,v])=>{
    const o=ac.createOscillator(),g=ac.createGain();o.type=m===1?'triangle':'sine';o.frequency.value=f*m;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05);
  });
}

/* ---- melodia: C – G – Am – F ---- */
const BARS=[[0,2,4,7,11,7,4,2],[4,6,8,11,8,6,4,6],[5,7,9,12,9,7,5,7],[3,5,7,10,7,5,3,5]];
let step=0,gatherAt=null,ended=false;
const STEP_MS=380;

function playKey(i,vol=.22){
  if(ac)tone(freq(midi(i)),ac.currentTime,1.6,vol);
  press[i]=1;
  const kx=x0+i*kw+kw/2;
  if(gatherAt!==null)spawnDots(26,kx);
}
function tick(){
  if(ended)return;
  const bar=BARS[Math.floor(step/8)%4],k=bar[step%8];
  playKey(k);
  if(step%8===0&&ac)tone(freq(midi(k)-12),ac.currentTime,2.4,.2);
  step++;
  if(step===8&&gatherAt===null)gatherAt=performance.now();
  if(textPts.length&&spawned>=textPts.length&&step%8===0){ // acorde final
    ended=true;doneAt=performance.now();[0,2,4,7].forEach((k,j)=>setTimeout(()=>playKey(k,.2),j*90));
    return;
  }
  setTimeout(tick,STEP_MS);
}

/* ---- partículas que formam a mensagem ---- */
let spawned=0;
function spawnDots(n,kx){
  for(let j=0;j<n&&spawned<textPts.length;j++,spawned++){
    const t=textPts[spawned];
    dots.push({x:kx+(Math.random()-.5)*kw,y:pTop,vx:(Math.random()-.5)*5,vy:-4-Math.random()*5,tx:t[0],ty:t[1],
      ch:['♪','♫','♩','♬'][Math.random()*4|0],h:44+Math.random()*10,l:55+Math.random()*18,ph:Math.random()*6.28,
      w:performance.now()+Math.random()*500});
  }
}

/* ---- desenho ---- */
function drawPiano(){
  for(let i=0;i<14;i++){
    const x=x0+i*kw,p=press[i];
    const g=ctx.createLinearGradient(0,pTop,0,pTop+ph);
    g.addColorStop(0,p>.05?`rgb(255,${240-p*20|0},${235-p*140|0})`:'#fff');g.addColorStop(1,p>.05?'#ffe27a':'#e9dff0');
    ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x+1,pTop+p*4,kw-2,ph-p*4,[0,0,8,8]);ctx.fill();
    if(p>.05){ctx.save();ctx.globalAlpha=p*.5;ctx.shadowColor='#ffd84a';ctx.shadowBlur=26;ctx.fillStyle='#ffd84a';ctx.fillRect(x+4,pTop,kw-8,6);ctx.restore();}
    press[i]=Math.max(0,p-.035);
  }
  for(let i=0;i<13;i++){
    if(!BL.includes(i%7))continue;
    ctx.fillStyle='#1a0a26';ctx.beginPath();ctx.roundRect(x0+(i+1)*kw-kw*.3,pTop,kw*.6,ph*.6,[0,0,5,5]);ctx.fill();
  }
}
function frame(now){
  ctx.clearRect(0,0,W,H);
  ctx.textAlign='center';ctx.textBaseline='middle';
  glyphs=glyphs.filter(g=>g.a>0);
  for(const g of glyphs){
    g.y+=g.vy;g.x+=Math.sin(g.sw+=.04)*.9;g.a-=.0045;
    ctx.globalAlpha=Math.max(0,g.a);ctx.fillStyle='#ffd84a';ctx.font=g.s+'px serif';ctx.fillText(g.ch,g.x,g.y);
  }
  ctx.globalCompositeOperation='lighter';
  for(const d of dots){
    if(now<d.w)continue;
    d.vx+=(d.tx-d.x)*.009;d.vy+=(d.ty-d.y)*.009;d.vx*=.9;d.vy*=.9;d.x+=d.vx;d.y+=d.vy;
    const tw=.65+.35*Math.sin(now/300+d.ph);
    ctx.globalAlpha=.9*tw;ctx.fillStyle=`hsl(${d.h},95%,${d.l}%)`;
    ctx.font=gs+'px serif';ctx.fillText(d.ch,d.x,d.y);
  }
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  drawPiano();
  if(doneAt&&!document.getElementById('go').classList.contains('show')&&now-doneAt>2500)
    document.getElementById('go').classList.add('show');
  requestAnimationFrame(frame);
}

/* ---- início ---- */
document.getElementById('start').addEventListener('click',function(){
  ac=new (window.AudioContext||window.webkitAudioContext)();
  master=ac.createGain();master.gain.value=.5;master.connect(ac.destination);
  this.style.opacity=0;this.style.pointerEvents='none';setTimeout(()=>this.remove(),1000);
  setTimeout(tick,600);
});
document.getElementById('btn').addEventListener('click',()=>{
  ended=true;if(ac)master.gain.linearRampToValueAtTime(0,ac.currentTime+1.5);
  document.getElementById('s1').classList.add('out');
  document.getElementById('s2').classList.add('show');
});
addEventListener('resize',layout);
layout();requestAnimationFrame(frame);

/* ---- cena 2: girassóis ---- */

  const P=(n,f)=>Array.from({length:n},(_,i)=>f(i)).join('');

    setTimeout(()=>cnt.textContent='🌻 '+got+' / 7',800);

  function bouquet(){

/* ---- cena 3: chuva de estrelas cadentes ---- */
function scene3(){
  const s3=document.getElementById('s3'),cv3=document.getElementById('c3'),g=cv3.getContext('2d');
  let w,h,d=Math.min(devicePixelRatio||1,2);
  const size=()=>{w=innerWidth;h=innerHeight;cv3.width=w*d;cv3.height=h*d;g.setTransform(d,0,0,d,0,0);};
  size();addEventListener('resize',size);
  const bg=Array.from({length:140},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.4+.3,p:Math.random()*6.28}));
  const ss=[];let t0=performance.now(),last=0;
  s3.classList.add('show');
  setTimeout(()=>document.getElementById('msg3').classList.add('show'),11000);
  function spawn(){
    const v=9+Math.random()*9,a=Math.PI*(.62+Math.random()*.08);
    ss.push({x:Math.random()*(w+h*.6),y:-60,vx:Math.cos(a)*v,vy:Math.sin(a)*v,len:70+Math.random()*110,wd:1.2+Math.random()*1.8});
  }
  function loop(now){
    if(window.__stop3)return;
    const t=now-t0;g.clearRect(0,0,w,h);
    for(const b of bg){g.globalAlpha=.35+.35*Math.sin(now/700+b.p);g.fillStyle='#fff8d0';g.beginPath();g.arc(b.x*w,b.y*h,b.r,0,6.283);g.fill();}
    const gap=Math.max(55,520-t/18);
    if(now-last>gap){spawn();if(t>6000&&Math.random()<.5)spawn();last=now;}
    g.globalCompositeOperation='lighter';g.lineCap='round';
    for(let i=ss.length-1;i>=0;i--){
      const o=ss[i];o.x+=o.vx;o.y+=o.vy;
      if(o.y>h+80||o.x<-200){ss.splice(i,1);continue;}
      const m=Math.hypot(o.vx,o.vy),tx=o.x-o.vx/m*o.len,ty=o.y-o.vy/m*o.len;
      const gr=g.createLinearGradient(tx,ty,o.x,o.y);gr.addColorStop(0,'rgba(255,200,40,0)');gr.addColorStop(1,'rgba(255,236,120,.95)');
      g.globalAlpha=1;g.strokeStyle=gr;g.lineWidth=o.wd;g.beginPath();g.moveTo(tx,ty);g.lineTo(o.x,o.y);g.stroke();
      g.fillStyle='#fff6b8';g.shadowColor='#ffd84a';g.shadowBlur=14;g.beginPath();g.arc(o.x,o.y,o.wd+.8,0,6.283);g.fill();g.shadowBlur=0;
    }
    g.globalCompositeOperation='source-over';
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

/* ---- cena 4: exposição ---- */
(function(){
  const s4=document.getElementById('s4'),lb=document.getElementById('lb'),hint=document.getElementById('hint');
  const arts=[...s4.querySelectorAll('.art')],prv=document.getElementById('prv'),nxt=document.getElementById('nxt');let i=0;
  function show(n){
    const moved=n!==i;i=Math.max(0,Math.min(arts.length-1,n));
    arts.forEach((a,k)=>a.classList.toggle('on',k===i));
    prv.style.opacity=i?1:0;prv.style.pointerEvents=i?'auto':'none';
    nxt.style.opacity=i<arts.length-1?1:0;nxt.style.pointerEvents=i<arts.length-1?'auto':'none';
    if(moved)hint.style.display='none';
  }
  document.getElementById('nx3').onclick=()=>{s4.classList.add('show');show(0);setTimeout(()=>window.__stop3=true,2200);};
  prv.onclick=()=>show(i-1);nxt.onclick=()=>show(i+1);
  addEventListener('keydown',e=>{if(!s4.classList.contains('show'))return;if(e.key==='ArrowRight')show(i+1);if(e.key==='ArrowLeft')show(i-1);});
  let x0=null;
  s4.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;},{passive:true});
  s4.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>50)show(i+(dx<0?1:-1));});
  arts.forEach(a=>a.addEventListener('click',()=>{lb.querySelector('img').src=a.querySelector('img').src;lb.classList.add('on');}));
  lb.onclick=()=>lb.classList.remove('on');
})();
</script>
